name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # typecheck builds workspace deps first (packages resolve via dist/)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo:vertical-slice
      - run: npm run demo:mix-bank
      - run: npm run demo:midi
      - run: npm run demo:topology
      - run: npm run demo:bindings
      - run: npm run cli -- status
      - run: RODE_CONTROL_ADAPTER=rodecaster npm run cli -- surface headphones-level
      - run: RODE_CONTROL_ADAPTER=rodecaster npm run cli -- exec AdjustLevel headphones-level --delta 5
