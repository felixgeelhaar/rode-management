<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RØDE Control</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 12px;
        color: #eee;
        background: #2d2d2d;
        font-size: 13px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        opacity: 0.85;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #1f1f1f;
        color: #eee;
      }
      .hint {
        margin-top: 12px;
        opacity: 0.65;
        line-height: 1.35;
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label for="bindingId">Binding ID</label>
    <input id="bindingId" type="text" placeholder="e.g. game-level" spellcheck="false" />

    <label for="workflowId">Workflow ID (Apply Workflow key)</label>
    <input id="workflowId" type="text" placeholder="streaming" spellcheck="false" />

    <label for="sensitivity">Sensitivity (dial ticks)</label>
    <input id="sensitivity" type="number" min="0.1" step="0.5" placeholder="1" />

    <p class="hint">
      Stable IDs: <code>my-mic-gain</code>, <code>my-mic-monitor</code>,
      <code>game-level</code>, <code>chat-level</code>, <code>music-level</code>,
      <code>headphones-level</code>, <code>mic-mute</code>,
      <code>game-listen</code>, <code>pad-1</code>, <code>record</code>,
      <code>my-mic-hpf</code>, <code>my-mic-comp</code>. Workflows:
      <code>streaming</code>, <code>podcast</code>, or a custom id for
      <strong>Capture Workflow</strong>. Leave blank to use the action default.
    </p>

    <script>
      let websocket;
      let uuid;
      let actionInfo;

      function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
        uuid = inUUID;
        actionInfo = JSON.parse(inActionInfo);
        websocket = new WebSocket("ws://127.0.0.1:" + inPort);

        websocket.onopen = function () {
          websocket.send(
            JSON.stringify({
              event: inRegisterEvent,
              uuid: inUUID,
            }),
          );
          applySettings(actionInfo.payload && actionInfo.payload.settings);
        };

        websocket.onmessage = function (evt) {
          const data = JSON.parse(evt.data);
          if (data.event === "didReceiveSettings") {
            applySettings(data.payload && data.payload.settings);
          }
        };
      }

      function applySettings(settings) {
        settings = settings || {};
        document.getElementById("bindingId").value = settings.bindingId || "";
        document.getElementById("workflowId").value = settings.workflowId || "";
        document.getElementById("sensitivity").value =
          settings.sensitivity != null ? settings.sensitivity : "";
      }

      function saveSettings() {
        if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
        const bindingId = document.getElementById("bindingId").value.trim();
        const sensitivityRaw = document.getElementById("sensitivity").value.trim();
        const settings = {};
        if (bindingId) settings.bindingId = bindingId;
        const workflowId = document.getElementById("workflowId").value.trim();
        if (workflowId) settings.workflowId = workflowId;
        if (sensitivityRaw !== "" && !Number.isNaN(Number(sensitivityRaw))) {
          settings.sensitivity = Number(sensitivityRaw);
        }
        websocket.send(
          JSON.stringify({
            event: "setSettings",
            context: actionInfo.context,
            payload: settings,
          }),
        );
      }

      document.getElementById("bindingId").addEventListener("change", saveSettings);
      document.getElementById("workflowId").addEventListener("change", saveSettings);
      document.getElementById("sensitivity").addEventListener("change", saveSettings);

      window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
    </script>
  </body>
</html>
